# ============================================================================
# Workflow: Publish to npm on push to main
# ============================================================================
# Ce workflow publie automatiquement le package sur npm quand du code est
# mergé dans la branche main.
#
# Prérequis:
# - Trusted Publishing (OIDC) configuré sur npmjs.com pour ce package
#   → Aller sur: https://www.npmjs.com/package/liminal-ui-library/access
#   → Configurer: GitHub Actions avec org "The-Genium007", repo "liminal-ui-library", workflow "publish-on-main.yml"
# - package.json.version doit être incrémentée manuellement avant le merge
# - package.json.repository doit pointer vers le bon repo GitHub
#
# Le workflow:
# 1. Récupère la version locale et la dernière version npm
# 2. Si version locale = dernière version npm → Publie (permet de republier)
# 3. Si version locale ≠ dernière version npm → Skip avec warning
# 4. Execute les tests si présents
# 5. Build le projet
# 6. Publie avec OIDC (Trusted Publishing) - provenance automatique
# ============================================================================

name: Publish to npm on push to main

on:
  push:
    branches:
      - main
    # Ne pas filtrer sur paths - on veut publier même sans changement de package.json

permissions:
  contents: read  # Lecture seule du repo
  id-token: write # Requis pour npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      # ========================================================================
      # Checkout & Setup
      # ========================================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # ========================================================================
      # Installation & Tests
      # ========================================================================

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests (if present)
        run: npm test --if-present
        continue-on-error: false

      - name: 🔨 Build library (if present)
        run: npm run build --if-present

      # ========================================================================
      # Version Check - Publish only if local version matches npm latest
      # ========================================================================

      - name: 🔍 Compare local version with npm registry
        id: check_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          echo "📦 Package: $PACKAGE_NAME"
          echo "📍 Local version: $LOCAL_VERSION"

          # Récupérer la dernière version sur npm (ou "none" si package n'existe pas)
          NPM_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "none")
          echo "📦 npm latest version: $NPM_VERSION"

          # Logique inversée : publier SI les versions correspondent
          if [ "$LOCAL_VERSION" = "$NPM_VERSION" ]; then
            echo "✅ Local version matches npm version - will publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          elif [ "$NPM_VERSION" = "none" ]; then
            echo "✨ Package not found on npm - first publication"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  WARNING: Version mismatch!"
            echo "⚠️  Local: $LOCAL_VERSION | npm: $NPM_VERSION"
            echo "⚠️  Publication skipped - please update package.json version to match npm"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "package_version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
          echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT

      # ========================================================================
      # Validation package.json
      # ========================================================================

      - name: ⚠️  Verify repository field in package.json
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          REPO_URL=$(node -p "require('./package.json').repository?.url || ''" 2>/dev/null)

          if [ -z "$REPO_URL" ]; then
            echo "⚠️  WARNING: package.json.repository.url is missing!"
            echo "⚠️  This is required for npm provenance (--provenance flag)"
            echo "⚠️  Publication will continue but provenance may fail"
          else
            echo "✅ Repository URL found: $REPO_URL"
          fi

      # ========================================================================
      # Publication npm avec provenance
      # ========================================================================

      - name: 🚀 Publish to npm with Trusted Publishing (OIDC)
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          echo "📤 Publishing ${{ steps.check_version.outputs.package_name }}@${{ steps.check_version.outputs.package_version }}"

          # Publication avec Trusted Publishing (OIDC)
          # Le flag --provenance n'est pas nécessaire car provenance est automatique avec OIDC
          # Pas besoin de NPM_TOKEN - l'authentification se fait via OIDC
          npm publish --access public

          echo "✅ Publication npm réussie avec Trusted Publishing"
          echo "📦 Package disponible: https://www.npmjs.com/package/${{ steps.check_version.outputs.package_name }}/v/${{ steps.check_version.outputs.package_version }}"

      - name: ⚠️ Skip publication (version mismatch)
        if: steps.check_version.outputs.should_publish == 'false'
        run: |
          echo "::warning::Version mismatch detected!"
          echo "::warning::Local version: ${{ steps.check_version.outputs.package_version }}"
          echo "::warning::npm version: ${{ steps.check_version.outputs.npm_version }}"
          echo "::warning::Publication skipped - please update package.json to match npm version"
          echo ""
          echo "⚠️  PUBLICATION SKIPPED"
          echo "📍 Local version: ${{ steps.check_version.outputs.package_version }}"
          echo "📦 npm latest: ${{ steps.check_version.outputs.npm_version }}"
          echo ""
          echo "🔧 To fix: Update package.json version to match npm registry"
          exit 1
